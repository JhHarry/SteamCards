<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta
      name="description"
      content="Steam 卡牌估值 Web 前端：扫描库存集换式卡牌，按市场最低价估值并导出 CSV。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.2' fill='%2326211d'/%3E%3Cg transform='rotate(-15 13 15)'%3E%3Crect x='7' y='6' width='12' height='17' rx='1.6' fill='%23b7613d'/%3E%3C/g%3E%3Cg transform='rotate(9 19 17)'%3E%3Crect x='12' y='7' width='12.5' height='18' rx='1.7' fill='%23f2eadf'/%3E%3C/g%3E"
    />
    <title>Steam 卡牌估值</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("steamcards-theme");
          var fromUrl = new URLSearchParams(location.search).get("theme");
          var theme = fromUrl === "light" || fromUrl === "dark" || fromUrl === "system"
            ? fromUrl
            : stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          document.documentElement.setAttribute("data-theme", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
